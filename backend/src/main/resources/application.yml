spring:
  application:
    name: rabbitrole
  profiles:
    group:
      # dev/prod run on Lambda and need the AWS-backed beans + SSM secrets.
      dev: aws
      prod: aws
  servlet:
    multipart:
      # Resumes are small; cap uploads so a bad file can't exhaust memory.
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

# AI + jobs config. Keys come from .env locally (loaded by spring-dotenv via the
# bootRun working dir = repo root) and SSM/Lambda env in prod;
# the empty defaults let the app boot (and unit tests run) without them.
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  chat-model: gpt-4o-mini
  embedding-model: text-embedding-3-small

# JSearch (RapidAPI) — live job postings. Key from .env locally, SSM in prod.
jsearch:
  api-key: ${JSEARCH_API_KEY:}
  base-url: https://api.openwebninja.com/jsearch
  country: us

---
# AWS profile: activated by the dev/prod groups above. Supplies the wiring the
# RDS Data API repos, S3 storage, and SSM secret loader need. Values come from
# the Lambda's environment variables (infra/modules/rabbitrole/api.tf).
spring:
  config:
    activate:
      on-profile: aws
  security:
    oauth2:
      resourceserver:
        jwt:
          # Cognito user-pool issuer; the Lambda gets this from Terraform
          # (infra/modules/rabbitrole/api.tf) once the pool exists.
          issuer-uri: ${COGNITO_ISSUER_URI}
aws:
  resumes-bucket: ${RESUMES_BUCKET}
  ssm-prefix: ${SSM_PREFIX}
  dynamo-table-prefix: ${DYNAMO_TABLE_PREFIX}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
