# Deploy on push to main: build + test, apply infra, build the backend zip and ship a
# new SnapStart version (repointing the `live` alias), then ship the frontend. The
# zip Lambda creates in a single apply — no ECR / image chicken-and-egg.
#
# Requires the remote-state bootstrap to have been applied once (see DEPLOY.md)
# and these repo Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# OPENAI_API_KEY, JSEARCH_API_KEY. Optional: GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET.

name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/environments/dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Backend build + test
        working-directory: backend
        run: ./gradlew --no-daemon build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint + build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_jsearch_api_key: ${{ secrets.JSEARCH_API_KEY }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        # State bucket name is account-derived (not hardcoded in backend.tf).
        run: |
          terraform init -input=false \
            -backend-config="bucket=rabbitrole-tfstate-$(aws sts get-caller-identity --query Account --output text)"

      # One pass: creates the artifacts bucket + the function (from a placeholder) +
      # the live alias. No ECR ordering needed.
      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve

      # Build the zip, upload it, publish a new SnapStart-enabled version, and point
      # the live alias at it. api.tf ignores the function's code, so this is what
      # actually ships backend changes.
      - name: Build + deploy backend (zip)
        working-directory: ${{ env.TF_DIR }}
        run: |
          (cd "$GITHUB_WORKSPACE/backend" && ./gradlew --no-daemon lambdaZip)
          BUCKET=$(terraform output -raw artifacts_bucket)
          FUNC=$(terraform output -raw lambda_function_name)
          ALIAS=$(terraform output -raw lambda_alias)
          aws s3 cp "$GITHUB_WORKSPACE/backend/build/dist/app.zip" "s3://$BUCKET/backend/app.zip"
          VERSION=$(aws lambda update-function-code --region ${{ env.AWS_REGION }} \
            --function-name "$FUNC" --s3-bucket "$BUCKET" --s3-key backend/app.zip \
            --publish --query Version --output text)
          aws lambda wait published-version-active --region ${{ env.AWS_REGION }} \
            --function-name "$FUNC" --qualifier "$VERSION"
          aws lambda update-alias --region ${{ env.AWS_REGION }} \
            --function-name "$FUNC" --name "$ALIAS" --function-version "$VERSION"

      - name: Build + deploy frontend
        working-directory: ${{ env.TF_DIR }}
        run: |
          API=$(terraform output -raw api_url)
          DOMAIN=$(terraform output -raw cognito_hosted_ui_domain)
          CLIENT=$(terraform output -raw cognito_client_id)
          BUCKET=$(terraform output -raw frontend_bucket)
          DIST=$(terraform output -raw cloudfront_distribution_id)
          cd "$GITHUB_WORKSPACE/frontend"
          npm ci
          NEXT_PUBLIC_API_URL="$API" \
          NEXT_PUBLIC_COGNITO_DOMAIN="$DOMAIN" \
          NEXT_PUBLIC_COGNITO_CLIENT_ID="$CLIENT" \
          NEXT_PUBLIC_COGNITO_REGION="${{ env.AWS_REGION }}" \
            npm run build
          aws s3 sync out/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*' >/dev/null
