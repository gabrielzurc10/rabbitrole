# Deploy prod MANUALLY only — never on a git push. Trigger from the Actions tab
# (deploy-prod -> Run workflow) or `gh workflow run deploy-prod.yml`, picking the
# ref/tag to deploy. Dev deploys automatically on push to main; prod does not.
name: deploy-prod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      tf_dir: infra/environments/prod
      lambda_name: rabbitrole-prod-backend
    secrets: inherit
